<body data-root="../">

<header class="bar">
  <div class="wrap">
    <a class="logo" href="../index.html">OIC from Scratch <span>✎</span></a>
    <nav class="main" aria-label="Main">
      <a href="../index.html">Home</a>

<main class="wrap">
  <section aria-labelledby="notes-title">
    <p class="eyebrow">The notebook</p>
    <h1 id="notes-title">All notes</h1>
    <svg class="squiggle" viewBox="0 0 200 14" aria-hidden="true"><path d="M3 8 C 22 2, 40 13, 62 7 S 104 2, 126 8 S 168 13, 197 6"/></svg>
    <p class="lede">Read them in order: each phase builds on the one before. New notes are added here as soon as they’re published.</p>

    <div class="tools">
      <label for="q" class="eyebrow" style="position:absolute;left:-9999px">Search notes</label>
      <input id="q" class="search" type="search" placeholder="Search a topic, e.g. DNS, PATCH, 404…" autocomplete="off">
      <div class="filters" id="filters" role="group" aria-label="Filter by phase"></div>
    </div>
    <p class="meta" id="count" aria-live="polite" style="color:var(--ink-soft)"></p>
    <ul class="note-list" id="all-notes"><li class="empty">Loading notes…</li></ul>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span>OIC from Scratch · made by @devwithprabir</span>
